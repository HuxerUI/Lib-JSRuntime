name: ci

on:
  push:
  pull_request:

jobs:
  esbuild:
    name: esbuild (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ci/esbuild-smoke -B build -DHUXERUI_TSX_ESBUILD_PLATFORM=${{ matrix.platform }}
      - name: Build bundle
        run: cmake --build build --config Release
      - name: Verify bundle
        run: cmake "-DINPUT=build/app.js" -P ci/verify-bundle.cmake
      - name: Verify showcase bundle
        run: cmake "-DINPUT=build/showcase.js" -P ci/verify-showcase.cmake
